<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title">
<title id="title">Aditya Mandal — Full Stack Developer based in Kolkata, India. 4+ years building for the web.</title>
